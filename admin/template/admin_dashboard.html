<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    <script>

    function logout(){

        // clear local/session storage
        localStorage.clear();
        sessionStorage.clear();

        // redirect to login page
        window.location.href = 'http://localhost/FYP/FYP%20COURSE%20REGISTRATION/index.html';
    }

</script>
    <style>

        *{
            font-family: 'Poppins', sans-serif;
        }

        body{
            background: #f8f6f4;
        }

        .sidebar{
            width: 280px;
            height: 100vh;
            background: linear-gradient(to bottom, #670019, #8b0022);
            position: fixed;
            padding: 30px 20px;
        }

        .sidebar h3{
            color: white;
            margin-bottom: 40px;
        }

        .sidebar a{
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .sidebar a:hover,
        .active{
            background: linear-gradient(to right, #f4a000, #e08700);
        }

        .main{
            margin-left: 280px;
            padding: 40px;
        }

        .hero{
            background: white;
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 35px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.05);
        }

        .dashboard-card{
            background: white;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .dashboard-card:hover{
            transform: translateY(-5px);
        }

        .dashboard-card h2{
            font-size: 45px;
            color: #670019;
            font-weight: 700;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <h3>Admin Portal</h3>

    <a href="admin_dashboard.html" class="active">
        <i class="bi bi-house-fill"></i> Dashboard
    </a>

    <a href="admin_profile.html">
        <i class="bi bi-person-fill"></i> Profile
    </a>

    <a href="add_student.html">
        <i class="bi bi-person-plus-fill"></i> Add Student
    </a>

    <a href="add_advisor.html">
        <i class="bi bi-people-fill"></i> Add Advisor
    </a>

    <a href="add_subject.html">
        <i class="bi bi-book-fill"></i> Add Subject
    </a>

    <a href="reset_password_form.html">
        <i class="bi bi-key-fill"></i> Forgot Password
    </a>

    <a href="#" onclick="logout()">
    <i class="bi bi-box-arrow-right"></i> Logout
</a>

</div>

<div class="main">

    <div class="hero">

        <h1>Welcome Admin 👋</h1>

        <p class="text-muted">
            Manage students, advisors and subjects here.
        </p>

    </div>

    <div class="row g-4">

        <div class="col-md-4">

            <div class="dashboard-card">

                <i class="bi bi-person-fill fs-1 text-warning"></i>

                <h2>120</h2>

                <p>Students Registered</p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="dashboard-card">

                <i class="bi bi-people-fill fs-1 text-danger"></i>

                <h2>20</h2>

                <p>Academic Advisors</p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="dashboard-card">

                <i class="bi bi-book-fill fs-1 text-success"></i>

                <h2>35</h2>

                <p>Subjects Registered</p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
