<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background: #f8f6f4;
            font-family: Poppins;
        }

        .sidebar{
            width: 280px;
            height: 100vh;
            background: linear-gradient(to bottom, #670019, #8b0022);
            position: fixed;
            padding: 30px 20px;
        }

        .sidebar a{
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .sidebar a:hover,
        .active{
            background: linear-gradient(to right, #f4a000, #e08700);
        }

        .main{
            margin-left: 280px;
            padding: 40px;
        }

        .course-card{
            background: white;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.05);
        }

    </style>

</head>
<body>

<div class="sidebar">

    <h3 class="text-white mb-5">Student Portal</h3>

    <a href="student_dashboard.html">
        Dashboard
    </a>

    <a href="profile.html">
        Profile
    </a>

    <a href="courses.html" class="active">
        Courses
    </a>

    <a href="my_registration.html">
        Registration
    </a>

</div>

<div class="main">

    <h2 class="mb-4">Available Courses</h2>

    <div class="course-card">

        <h4>Web Programming</h4>

        <p class="text-muted">SECJ2154</p>

        <button class="btn btn-success">
            Register
        </button>

    </div>

    <div class="course-card">

        <h4>Database</h4>

        <p class="text-muted">SECJ2153</p>

        <button class="btn btn-success">
            Register
        </button>

    </div>

    <div class="course-card">

        <h4>Software Engineering</h4>

        <p class="text-muted">SECJ2152</p>

        <button class="btn btn-success">
            Register
        </button>

    </div>

</div>

</body>
</html>
