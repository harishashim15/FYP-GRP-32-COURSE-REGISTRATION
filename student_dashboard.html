<script src="js/common.js"></script>
<script>
    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const main = document.querySelector('.main-content');
        sidebar.classList.toggle('collapsed');
        main.classList.toggle('expanded');
        localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    }
    (function() {
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            document.querySelector('.sidebar').classList.add('collapsed');
            document.querySelector('.main-content').classList.add('expanded');
        }
    })();

    async function loadStudentDashboard() {
        try {
            console.log('Loading student dashboard...');
            const stats = await apiGet('dashboard/student_stats.php');
            console.log('API Response:', stats);
            
            // Update all the elements
            const studentName = stats.student_name || 'Student';
            const firstName = studentName.split(' ')[0];
            
            document.getElementById('registeredCourses').innerText = stats.registered_courses || 0;
            document.getElementById('pendingApprovals').innerText = stats.pending_approvals || 0;
            document.getElementById('approvedCourses').innerText = stats.approved_courses || 0;
            document.getElementById('currentSession').innerText = stats.current_session || '2025/2026';
            document.getElementById('currentSemester').innerHTML = `Semester ${stats.current_semester || 2}`;
            document.getElementById('studentName').innerText = studentName;
            document.getElementById('heroGreeting').innerHTML = `Welcome back, ${firstName}!`;
            
            // Also update the page title or any other elements that show student name
            console.log('Student name set to:', studentName);
            
            // Load registration period
            const period = await apiGet('registrations/period.php');
            console.log('Period Response:', period);
            
            const statusSpan = document.getElementById('periodStatus');
            statusSpan.innerHTML = period.is_open ? '🟢 Currently open' : '🔴 Closed';
            statusSpan.style.background = period.is_open ? '#d4edda' : '#f8d7da';
            statusSpan.style.color = period.is_open ? '#155724' : '#721c24';
            document.getElementById('periodDates').innerText = `${period.start_date} – ${period.end_date}`;
            document.getElementById('periodBadges').innerHTML = `
                <span class="badge bg-light text-dark me-1">${period.semester}</span>
                <span class="badge bg-light text-dark me-1">${period.session}</span>
                <span class="badge ${period.is_open ? 'bg-success' : 'bg-secondary'}">${period.is_open ? 'Active' : 'Inactive'}</span>
            `;
        } catch (err) {
            console.error('Error loading dashboard:', err);
            document.getElementById('heroGreeting').innerHTML = 'Welcome back, Student! (Error loading data)';
        }
    }
    
    loadStudentDashboard();
</script>
