<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            font-family: 'Poppins', sans-serif;

        body{

            height: 100vh;
            background: linear-gradient(to bottom, #670019, #8b0022);
            position: fixed;
            padding: 30px 20px;
        }

        .sidebar a{
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .sidebar a:hover,
        .active{
            background: linear-gradient(to right, #f4a000, #e08700);
        }

        .main{
            margin-left: 280px;
            padding: 40px;
        }

        .profile-card{
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.05);
        }

        .profile-img{
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin-bottom: 20px;

<body>

<div class="sidebar">

    <h3 class="text-white mb-5">Student Portal</h3>

    <a href="student_dashboard.html">
        <i class="bi bi-house-fill"></i> Dashboard
    </a>

    <a href="profile.html" class="active">
        <i class="bi bi-person-fill"></i> Profile
    </a>

    <a href="courses.html">
        <i class="bi bi-book-fill"></i> Courses
    </a>

    <a href="my_registration.html">

    </a>

</div>

<div class="main">

    <div class="profile-card text-center">

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="profile-img">

        <h2>Ali</h2>

        <p class="text-muted">Student</p>

        <hr>

        <div class="row mt-4">

            <div class="col-md-6">

                <h5>Email</h5>

                <p class="text-muted">ali@gmail.com</p>

            </div>

            <div class="col-md-6">

                <h5>Matric Number</h5>

                <p class="text-muted">A22EC0011</p>

            </div>

        </div>

        <a href="edit_profile.html" class="btn btn-warning mt-4">
