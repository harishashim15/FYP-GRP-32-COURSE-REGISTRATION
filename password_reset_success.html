<!DOCTYPE html>
<html lang="en">
<head>
    <title>Password Reset Success - UTM Course Registration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="images/logoWebsite.png"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/util.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <style>
        .success-icon {
            font-size: 80px;
            color: #57b846;
            margin-bottom: 20px;
        }
        .message-box {
            text-align: center;
            width: 100%;
        }
        .btn-login {
            background: #57b846;
            color: white;
            padding: 10px 30px;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .btn-login:hover {
            background: #429c33;
            color: white;
            text-decoration: none;
        }
        .wrap-login100 {
            padding: 50px 40px 40px 40px !important;
        }
        .container-login100 {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="limiter">
        <div class="container-login100">
            <div class="wrap-login100">
                <div class="message-box">
                    <div class="success-icon">
                        <i class="fa fa-check-circle" aria-hidden="true"></i>
                    </div>
                    
                    <span class="login100-form-title tracking-in-expand" style="font-size: 24px;">
                        Password Reset Successful!
                    </span>

                    <p style="margin-top: 20px; color: #555;">
                        Your password has been successfully reset.
                    </p>
                    
                    <p style="color: #888;">
                        You can now log in with your new password.
                    </p>

                    <a href="index.html" class="btn-login">
                        Login Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
