<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: maroon; }
        #error-msg { display: none; }
    </style>
</head>
<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="width: 350px;">
        <h3 class="text-center mb-4">Login</h3>

        <div class="alert alert-danger" id="error-msg" role="alert">
            Invalid email or password.
        </div>

        <form onsubmit="login(event)">
            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input type="email" class="form-control" id="username" placeholder="Enter email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="login-btn">Login</button>
        </form>
    </div>
</div>

<script>
function login(event) {
    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("error-msg");
    const loginBtn = document.getElementById("login-btn");

    // Reset error, show loading
    errorMsg.style.display = "none";
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    // Properly encode form data — handles special characters in passwords
    const body = new URLSearchParams({ username, password });

    fetch("login.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString()
    })
    .then(response => {
        if (!response.ok) throw new Error("Server error");
        return response.text();
    })
    .then(role => {
        role = role.trim();
        const routes = {
            student: "student.html",
            advisor: "advisor.html",
            admin:   "admin.html"
        };
        if (routes[role]) {
            window.location.href = routes[role];
        } else {
            errorMsg.style.display = "block";
            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
        }
    })
    .catch(() => {
        errorMsg.textContent = "A server error occurred. Please try again.";
        errorMsg.style.display = "block";
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    });
}
</script>

</body>
</html>
