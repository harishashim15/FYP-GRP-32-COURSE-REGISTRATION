<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - UTM Course Registration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="images/logoWebsite.png"/>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f8f6f4; }
        .limiter { width: 100%; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #5D001D; background: radial-gradient(circle, rgba(93,0,29,1) 63%, rgba(230,147,5,1) 100%); padding: 15px; }
        .wrap-login100 {
    width: 960px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    padding: 177px 130px 120px 95px; /* Increased bottom padding from 33px to 60px */
}
        .login100-pic { width: 316px; }
        .login100-pic img { max-width: 100%; }
        .login100-form { width: 290px; }
        .login100-form-title { font-size: 24px; font-weight: 700; color: #333; text-align: center; padding-bottom: 54px; }
        .form-group { margin-bottom: 20px; }
        .form-control { height: 50px; border-radius: 25px; padding: 0 20px; font-size: 15px; border: 1px solid #e6e6e6; background: #e6e6e6; }
        .form-control:focus { box-shadow: none; border-color: #E69305; }
        .btn-login { width: 100%; height: 50px; border-radius: 25px; background: #5D001D; color: white; font-weight: 600; border: none; transition: 0.3s; }
        .btn-login:hover { background: #E69305; }
        .input-group-text { background: #e6e6e6; border: none; border-radius: 25px; cursor: pointer; }
        .forgot-link { text-align: center; margin-top: 15px; }
        .forgot-link a { color: #666; text-decoration: none; font-size: 13px; }
        .forgot-link a:hover { color: #E69305; }
        @media (max-width: 992px) {
            .wrap-login100 { padding: 100px 80px 33px 80px; }
            .login100-pic { display: none; }
            .login100-form { width: 100%; }
        }
    </style>
</head>
<body>
<div class="limiter">
    <div class="wrap-login100">
        <div class="login100-pic js-tilt" data-tilt>
            <img src="images/logoWebsite.png" alt="IMG">
        </div>
        <form class="login100-form validate-form" method="POST">
            <span class="login100-form-title">Login</span>
            <div class="form-group">
                <input type="text" class="form-control" name="id" placeholder="ID (Login Credential)" required>
            </div>
            <div class="form-group">
                <div class="input-group">
                    <input type="password" class="form-control" name="pass" id="login-password" placeholder="Password" required>
                    <button class="btn btn-outline-secondary input-group-text" type="button" id="togglePasswordBtn" style="border-radius: 25px; margin-left: 5px;">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-login">Login</button>
            <div class="forgot-link">
                <a href="forgot_password.html">Forgot Password?</a>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tilt.js/1.2.1/tilt.jquery.min.js"></script>
<script>
    $('.js-tilt').tilt({ scale: 1.1 });

    // Toggle password visibility
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('login-password');
    const eyeIcon = toggleBtn.querySelector('i');

    toggleBtn.addEventListener('click', function() {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('bi-eye');
            eyeIcon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('bi-eye-slash');
            eyeIcon.classList.add('bi-eye');
        }
    });

    // Handle form submission via AJAX (preserve your existing login.js logic)
    $('.validate-form').on('submit', function(e) {
        e.preventDefault();
        var loginCred = $('input[name="id"]').val().trim();
        var password = $('input[name="pass"]').val();

        $.ajax({
            url: 'login.php',
            type: 'POST',
            data: { username: loginCred, password: password },
            success: function(response) {
                response = response.trim();
                if (response === 'admin') window.location.href = 'admin/admin_dashboard.php';
                else if (response === 'advisor') window.location.href = 'advisor_dashboard.php';
                else if (response === 'student') window.location.href = 'student_dashboard.html';
                else if (response === 'invalid') alert('Invalid login credentials. Please try again.');
                else alert('Unexpected response: ' + response);
            },
            error: function() { alert('Could not connect to the server.'); }
        });
    });
</script>
</body>
</html>
