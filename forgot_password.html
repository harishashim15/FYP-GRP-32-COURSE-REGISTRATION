<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password - UTM Course Registration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="images/logoWebsite.png"/>

    <!-- Bootstrap CSS (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Font Awesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Animate CSS (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css">

    <!-- Hamburgers (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/hamburgers/1.1.3/hamburgers.min.css">

    <!-- Select2 (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">

    <!-- Local CSS -->
    <link rel="stylesheet" type="text/css" href="css/util.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">

    <style>
        /* Success step hidden by default */
        .reset-step { display: none; }

        /* Inline field error */
        .field-error-msg {
            color: #e74c3c;
            font-size: 13px;
            display: block;
            margin-top: 5px;
            padding-left: 5px;
        }

        /* General error message */
        #reset-error-msg {
            color: #e74c3c;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            display: none;
        }

        /* Success message styling */
        #reset-success-msg {
            text-align: center;
            padding: 20px 0;
        }

        #reset-success-msg i {
            font-size: 48px;
            color: #2ecc71;
            margin-bottom: 15px;
            display: block;
        }

        #reset-success-msg p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="limiter">
        <div class="container-login100">
            <!-- ── STEP 1: Email Input ── -->
            <div id="step-email" class="reset-step wrap-login100">

                <div class="login100-pic js-tilt" data-tilt>
                    <img src="images/logoWebsite.png" alt="IMG">
                </div>

                <form id="reset-password-form" class="login100-form validate-form">

                    <span class="login100-form-title tracking-in-expand">
                        Forgot Password
                    </span>

                    <div class="wrap-input100 validate-input" data-validate="Valid email is required">
                        <input class="input100" type="email" name="reset_email" placeholder="Registered Email Address">
                        <span class="focus-input100"></span>
                        <span class="symbol-input100">
                            <i class="fa fa-envelope" aria-hidden="true"></i>
                        </span>
                    </div>

                    <div class="container-login100-form-btn">
                        <button type="submit" id="reset-submit-btn" class="login100-form-btn">
                            Send Reset Link
                        </button>
                    </div>

                    <p id="reset-error-msg"></p>

                    <div class="text-center p-t-12">
                        <a class="txt2" href="index.html">Back to Login</a>
                    </div>

                    <div class="text-center p-t-166"></div>
                    
                </form>
            </div>

            <!-- ── STEP 2: Success Confirmation ── -->
            <div id="step-success" class="reset-step wrap-login100">

                <div class="login100-pic js-tilt" data-tilt>
                    <img src="images/logoWebsite.png" alt="IMG">
                </div>

                <div class="login100-form">
                    <span class="login100-form-title tracking-in-expand">
                        Check Your Email
                    </span>

                    <div id="reset-success-msg">
                        <i class="fa fa-check-circle"></i>
                        <p>
                            A password reset link has been sent to your email address.<br><br>
                            Please check your inbox and follow the instructions.<br>
                            The link will expire in <strong>1 hour</strong>.
                        </p>
                    </div>

                    <div class="text-center p-t-12" style="margin-top: 20px;">
                        <a class="txt2" href="index.html">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery (CDN) -->
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>

    <!-- Bootstrap JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

    <!-- Select2 (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- Tilt (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tilt.js/1.2.1/tilt.jquery.min.js"></script>
    <script>
        $('.js-tilt').tilt({ scale: 1.1 })
    </script>

    <!-- Forgot Password JS -->
    <script src="js/forgotpassword.js"></script>
</body>
</html>
